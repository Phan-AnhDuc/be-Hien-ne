<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMSTYLE - Bán Hàng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px 0;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.3);
            position: fixed;
            height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .sidebar-header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .sidebar-header p {
            font-size: 13px;
            opacity: 0.7;
            color: #a0a0a0;
        }

        .menu-item {
            padding: 14px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #f5576c;
            color: white;
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(245, 87, 108, 0.2) 0%, transparent 100%);
            border-left-color: #f5576c;
            color: white;
            font-weight: 600;
        }

        .menu-item-icon {
            width: 24px;
            font-size: 18px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 25px;
            background: #f8f9fc;
            min-height: 100vh;
        }

        .page-header {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .page-header h2 {
            color: #1a1a2e;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p {
            color: #666;
            font-size: 14px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.35);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(235, 51, 73, 0.35);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e0e0e0;
            color: #666;
        }

        .btn-outline:hover {
            border-color: #f5576c;
            color: #f5576c;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #1a1a2e 0%, #302b63 100%);
            color: white;
        }

        th {
            padding: 16px 18px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(245, 87, 108, 0.05) 0%, transparent 100%);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 14px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.1);
        }

        /* Cart Section */
        .cart-section {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 25px;
        }

        .products-panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .cart-panel {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 25px;
            max-height: calc(100vh - 50px);
            overflow-y: auto;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .cart-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .cart-item-price {
            color: #f5576c;
            font-weight: 600;
            font-size: 13px;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .qty-btn.minus {
            background: #ffe0e3;
            color: #f5576c;
        }

        .qty-btn.plus {
            background: #e0f7e9;
            color: #38ef7d;
        }

        .qty-btn:hover {
            transform: scale(1.1);
        }

        .qty-value {
            width: 40px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #eb3349;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            transition: transform 0.2s;
        }

        .cart-item-remove:hover {
            transform: scale(1.2);
        }

        .cart-summary {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #e0e0e0;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .cart-summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            padding-top: 12px;
            border-top: 2px solid #1a1a2e;
            margin-top: 15px;
        }

        .cart-summary-row .label {
            color: #666;
        }

        .cart-summary-row .value {
            font-weight: 600;
            color: #f5576c;
        }

        .cart-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .cart-empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.1);
        }

        /* Product Card Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fc 100%);
            border-radius: 14px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border-color: #f5576c;
        }

        .product-card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .product-card-name {
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .product-card-type {
            color: #888;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .product-card-stock {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .stock-available {
            background: #e0f7e9;
            color: #11998e;
        }

        .stock-low {
            background: #fff3e0;
            color: #f57c00;
        }

        .stock-out {
            background: #ffe0e3;
            color: #eb3349;
        }

        .product-card-price {
            font-size: 18px;
            font-weight: 700;
            color: #f5576c;
        }

        .product-card-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: linear-gradient(135deg, #1a1a2e 0%, #302b63 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .product-card-btn:hover {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .product-card-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header h3 {
            color: #1a1a2e;
            font-size: 22px;
            font-weight: 700;
        }

        .close-btn {
            background: #f5f5f5;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #666;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #ffe0e3;
            color: #f5576c;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            min-width: 320px;
            max-width: 420px;
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.4s ease-out, fadeOut 0.4s ease-in 2.6s forwards;
            pointer-events: auto;
            cursor: pointer;
        }

        .toast-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .toast-error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .toast-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .toast-icon {
            font-size: 24px;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .toast-message {
            font-size: 13px;
            opacity: 0.9;
        }

        .toast-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .toast-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #f5576c;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 70px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 18px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .stat-icon.pink {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stat-icon.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .stat-icon.blue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-icon.orange {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
        }

        .stat-info h3 {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .stat-info p {
            font-size: 13px;
            color: #888;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #e0f7e9;
            color: #11998e;
        }

        .badge-warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .badge-danger {
            background: #ffe0e3;
            color: #eb3349;
        }

        /* Discount Code Section */
        .discount-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fc;
            border-radius: 12px;
        }

        .discount-input-group {
            display: flex;
            gap: 10px;
        }

        .discount-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }

        .discount-input-group input:focus {
            outline: none;
            border-color: #f5576c;
        }

        .discount-applied {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: #e0f7e9;
            border-radius: 10px;
            margin-top: 10px;
        }

        .discount-applied span {
            color: #11998e;
            font-weight: 600;
            font-size: 14px;
        }

        .discount-applied button {
            background: none;
            border: none;
            color: #eb3349;
            cursor: pointer;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .cart-section {
                grid-template-columns: 1fr;
            }

            .cart-panel {
                position: relative;
                top: 0;
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🛍️ FMSTYLE</h1>
                <p>Hệ Thống Bán Hàng</p>
            </div>
            <div class="menu-item active" onclick="showPage('dashboard', this)">
                <span class="menu-item-icon">📊</span>
                <span>Tổng Quan</span>
            </div>
            <div class="menu-item" onclick="showPage('products', this)">
                <span class="menu-item-icon">📦</span>
                <span>Kho Hàng Hóa</span>
            </div>
            <div class="menu-item" onclick="showPage('create-order', this)">
                <span class="menu-item-icon">🧾</span>
                <span>Tạo Hóa Đơn</span>
            </div>
            <div class="menu-item" onclick="showPage('orders', this)">
                <span class="menu-item-icon">📋</span>
                <span>Danh Sách Hóa Đơn</span>
            </div>
            <div class="menu-item" onclick="showPage('customers', this)">
                <span class="menu-item-icon">👥</span>
                <span>Khách Hàng</span>
            </div>
            <div class="menu-item" onclick="window.location.href='index.html'">
                <span class="menu-item-icon">⚙️</span>
                <span>Quản Lý (Admin)</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div id="page-content">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Customer Modal -->
    <div id="customer-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chọn Khách Hàng</h3>
                <button class="close-btn" onclick="closeCustomerModal()">&times;</button>
            </div>
            <div id="customer-modal-body">
                <!-- Customer list -->
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
            <h3 style="color: #11998e; margin-bottom: 15px;">Tạo Hóa Đơn Thành Công!</h3>
            <p id="success-message" style="color: #666; margin-bottom: 25px;"></p>
            <div class="form-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="closeSuccessModal()">Đóng</button>
                <button class="btn btn-success" onclick="printInvoice()">🖨️ In Hóa Đơn</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentPage = 'dashboard';
        let products = [];
        let customers = [];
        let cart = [];
        let selectedCustomer = null;
        let appliedDiscount = null;
        let lastInvoiceId = null;
        let nhanvienList = [];
        let discountList = [];

        // Initialize
        window.onload = async function () {
            await loadInitialData();
            showPage('dashboard');
        };

        // Load initial data
        async function loadInitialData() {
            try {
                const [productsRes, customersRes, nhanvienRes, discountRes] = await Promise.all([
                    fetch(`${API_BASE}/hanghoa`),
                    fetch(`${API_BASE}/khachhang`),
                    fetch(`${API_BASE}/nhanvien`),
                    fetch(`${API_BASE}/magiamgia`)
                ]);

                const productsData = await productsRes.json();
                const customersData = await customersRes.json();
                const nhanvienData = await nhanvienRes.json();
                const discountData = await discountRes.json();

                if (productsData.success) products = productsData.data;
                if (customersData.success) customers = customersData.data;
                if (nhanvienData.success) nhanvienList = nhanvienData.data;
                if (discountData.success) discountList = discountData.data.filter(d => d.trangthai);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Show page
        function showPage(pageName, element) {
            currentPage = pageName;

            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });

            if (element) {
                element.classList.add('active');
            }

            switch (pageName) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'products':
                    renderProducts();
                    break;
                case 'create-order':
                    renderCreateOrder();
                    break;
                case 'orders':
                    renderOrders();
                    break;
                case 'customers':
                    renderCustomers();
                    break;
            }
        }

        // Render Dashboard
        async function renderDashboard() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>👋 Chào Mừng Bạn!</h2>
                    <p>Tổng quan hệ thống bán hàng FMSTYLE</p>
                </div>
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-icon pink">📦</div>
                        <div class="stat-info">
                            <h3 id="stat-products">0</h3>
                            <p>Sản phẩm</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">👥</div>
                        <div class="stat-info">
                            <h3 id="stat-customers">0</h3>
                            <p>Khách hàng</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">🧾</div>
                        <div class="stat-info">
                            <h3 id="stat-orders">0</h3>
                            <p>Hóa đơn</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">💰</div>
                        <div class="stat-info">
                            <h3 id="stat-revenue">0đ</h3>
                            <p>Doanh thu</p>
                        </div>
                    </div>
                </div>
                <div class="table-container" style="padding: 25px;">
                    <h3 style="margin-bottom: 20px; color: #1a1a2e;">🔥 Sản Phẩm Bán Chạy</h3>
                    <div id="top-products" class="product-grid"></div>
                </div>
            `;

            // Load stats
            try {
                const [productsRes, customersRes, ordersRes] = await Promise.all([
                    fetch(`${API_BASE}/hanghoa`),
                    fetch(`${API_BASE}/khachhang`),
                    fetch(`${API_BASE}/hoadon`)
                ]);

                const productsData = await productsRes.json();
                const customersData = await customersRes.json();
                const ordersData = await ordersRes.json();

                if (productsData.success) {
                    products = productsData.data;
                    document.getElementById('stat-products').textContent = productsData.count;
                }
                if (customersData.success) {
                    customers = customersData.data;
                    document.getElementById('stat-customers').textContent = customersData.count;
                }
                if (ordersData.success) {
                    document.getElementById('stat-orders').textContent = ordersData.count;
                    const totalRevenue = ordersData.data.reduce((sum, o) => sum + (parseFloat(o.tongtien) || 0), 0);
                    document.getElementById('stat-revenue').textContent = formatCurrency(totalRevenue);
                }

                // Top products
                const topProducts = products.slice(0, 4);
                renderTopProducts(topProducts);
            } catch (error) {
                showToast('Lỗi kết nối server', 'error');
            }
        }

        // Render top products
        function renderTopProducts(topProducts) {
            const container = document.getElementById('top-products');
            if (!container) return;

            if (topProducts.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Chưa có sản phẩm</p></div>';
                return;
            }

            container.innerHTML = topProducts.map(p => `
                <div class="product-card">
                    <div class="product-card-icon">👕</div>
                    <div class="product-card-name">${p.loaihang}</div>
                    <div class="product-card-type">Mã: ${p.maHang}</div>
                    <span class="product-card-stock ${getStockClass(p.soluong)}">
                        Còn ${p.soluong} ${p.donvi || 'sản phẩm'}
                    </span>
                    <div class="product-card-price">${formatCurrency(p.giabanra)}</div>
                </div>
            `).join('');
        }

        // Render Products Page
        async function renderProducts() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>📦 Kho Hàng Hóa</h2>
                    <p>Xem và quản lý kho hàng</p>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="search-product" placeholder="🔍 Tìm kiếm sản phẩm..." oninput="filterProducts()">
                    <button class="btn btn-secondary" onclick="loadProducts()">🔄 Tải Lại</button>
                </div>
                <div id="products-container" class="table-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            `;

            await loadProducts();
        }

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/hanghoa`);
                const result = await response.json();

                if (result.success) {
                    products = result.data;
                    renderProductsTable(products);
                }
            } catch (error) {
                showToast('Lỗi tải dữ liệu sản phẩm', 'error');
            }
        }

        // Render products table
        function renderProductsTable(data) {
            const container = document.getElementById('products-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Chưa có sản phẩm</p></div>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Mã Hàng</th>
                            <th>Loại Hàng</th>
                            <th>Số Lượng</th>
                            <th>Đơn Vị</th>
                            <th>Giá Nhập</th>
                            <th>Giá Bán</th>
                            <th>Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(p => `
                            <tr>
                                <td><strong>${p.maHang}</strong></td>
                                <td>${p.loaihang}</td>
                                <td>${p.soluong}</td>
                                <td>${p.donvi || '-'}</td>
                                <td>${formatCurrency(p.gianhapvao)}</td>
                                <td><strong style="color: #f5576c;">${formatCurrency(p.giabanra)}</strong></td>
                                <td><span class="badge ${getStockBadge(p.soluong)}">${getStockText(p.soluong)}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Filter products
        function filterProducts() {
            const keyword = document.getElementById('search-product').value.toLowerCase();
            const filtered = products.filter(p =>
                p.maHang.toLowerCase().includes(keyword) ||
                p.loaihang.toLowerCase().includes(keyword)
            );
            renderProductsTable(filtered);
        }

        // Render Create Order Page
        async function renderCreateOrder() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>🧾 Tạo Hóa Đơn Mới</h2>
                    <p>Chọn sản phẩm và tạo hóa đơn cho khách hàng</p>
                </div>
                <div class="cart-section">
                    <div class="products-panel">
                        <div class="search-box">
                            <input type="text" class="search-input" id="search-order-product" placeholder="🔍 Tìm sản phẩm..." oninput="filterOrderProducts()">
                        </div>
                        <div id="order-products" class="product-grid">
                            <div class="loading">
                                <div class="spinner"></div>
                            </div>
                        </div>
                    </div>
                    <div class="cart-panel">
                        <div class="cart-title">🛒 Giỏ Hàng</div>
                        <div id="cart-items"></div>
                        <div id="cart-summary"></div>
                    </div>
                </div>
            `;

            await loadProducts();
            renderOrderProducts(products);
            renderCart();
        }

        // Render products for order
        function renderOrderProducts(data) {
            const container = document.getElementById('order-products');
            if (!container) return;

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Không tìm thấy sản phẩm</p></div>';
                return;
            }

            container.innerHTML = data.map(p => `
                <div class="product-card" onclick="${p.soluong > 0 ? `addToCart('${p.maHang}')` : ''}">
                    <div class="product-card-icon">👕</div>
                    <div class="product-card-name">${p.loaihang}</div>
                    <div class="product-card-type">Mã: ${p.maHang}</div>
                    <span class="product-card-stock ${getStockClass(p.soluong)}">
                        Còn ${p.soluong} ${p.donvi || 'sp'}
                    </span>
                    <div class="product-card-price">${formatCurrency(p.giabanra)}</div>
                    <button class="product-card-btn" ${p.soluong <= 0 ? 'disabled' : ''} onclick="event.stopPropagation(); addToCart('${p.maHang}')">
                        ${p.soluong > 0 ? '➕ Thêm vào giỏ' : 'Hết hàng'}
                    </button>
                </div>
            `).join('');
        }

        // Filter order products
        function filterOrderProducts() {
            const keyword = document.getElementById('search-order-product').value.toLowerCase();
            const filtered = products.filter(p =>
                p.maHang.toLowerCase().includes(keyword) ||
                p.loaihang.toLowerCase().includes(keyword)
            );
            renderOrderProducts(filtered);
        }

        // Add to cart
        function addToCart(maHang) {
            const product = products.find(p => p.maHang === maHang);
            if (!product || product.soluong <= 0) {
                showToast('Sản phẩm đã hết hàng', 'error');
                return;
            }

            const existingItem = cart.find(c => c.maHang === maHang);
            if (existingItem) {
                if (existingItem.quantity >= product.soluong) {
                    showToast('Số lượng vượt quá tồn kho', 'error');
                    return;
                }
                existingItem.quantity++;
            } else {
                cart.push({
                    maHang: product.maHang,
                    name: product.loaihang,
                    price: product.giabanra,
                    quantity: 1,
                    maxQty: product.soluong
                });
            }

            renderCart();
            showToast(`Đã thêm ${product.loaihang}`, 'success');
        }

        // Update cart quantity
        function updateCartQty(maHang, delta) {
            const item = cart.find(c => c.maHang === maHang);
            if (!item) return;

            item.quantity += delta;

            if (item.quantity <= 0) {
                cart = cart.filter(c => c.maHang !== maHang);
            } else if (item.quantity > item.maxQty) {
                item.quantity = item.maxQty;
                showToast('Số lượng vượt quá tồn kho', 'error');
            }

            renderCart();
        }

        // Remove from cart
        function removeFromCart(maHang) {
            cart = cart.filter(c => c.maHang !== maHang);
            renderCart();
        }

        // Render cart
        function renderCart() {
            const itemsContainer = document.getElementById('cart-items');
            const summaryContainer = document.getElementById('cart-summary');

            if (!itemsContainer || !summaryContainer) return;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">🛒</div>
                        <p>Giỏ hàng trống</p>
                    </div>
                `;
                summaryContainer.innerHTML = '';
                return;
            }

            itemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${formatCurrency(item.price)}</div>
                    </div>
                    <div class="cart-item-qty">
                        <button class="qty-btn minus" onclick="updateCartQty('${item.maHang}', -1)">−</button>
                        <span class="qty-value">${item.quantity}</span>
                        <button class="qty-btn plus" onclick="updateCartQty('${item.maHang}', 1)">+</button>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart('${item.maHang}')">🗑️</button>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discountAmount = appliedDiscount ? (subtotal * appliedDiscount.phantramgiam / 100) : 0;
            const total = subtotal - discountAmount;

            summaryContainer.innerHTML = `
                <div class="cart-summary">
                    <div class="cart-summary-row">
                        <span class="label">Tạm tính:</span>
                        <span class="value">${formatCurrency(subtotal)}</span>
                    </div>
                    
                    <div class="discount-section">
                        <label style="font-weight: 600; font-size: 13px; margin-bottom: 8px; display: block;">🎫 Mã giảm giá:</label>
                        ${appliedDiscount ? `
                            <div class="discount-applied">
                                <span>✅ ${appliedDiscount.code} (-${appliedDiscount.phantramgiam}%)</span>
                                <button onclick="removeDiscount()">✕</button>
                            </div>
                        ` : `
                            <select id="discount-code" onchange="applyDiscount()" style="width: 100%; padding: 12px 15px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 14px; font-family: inherit; cursor: pointer;">
                                <option value="">-- Không áp dụng --</option>
                                ${discountList.map(d => `
                                    <option value="${d.code}" data-percent="${d.phantramgiam}">
                                        ${d.code} - Giảm ${d.phantramgiam}% ${d.mota ? '(' + d.mota + ')' : ''}
                                    </option>
                                `).join('')}
                            </select>
                            ${discountList.length === 0 ? '<p style="font-size: 12px; color: #999; margin-top: 8px;">Không có mã giảm giá khả dụng</p>' : ''}
                        `}
                    </div>
                    
                    ${discountAmount > 0 ? `
                        <div class="cart-summary-row">
                            <span class="label">Giảm giá:</span>
                            <span class="value" style="color: #11998e;">-${formatCurrency(discountAmount)}</span>
                        </div>
                    ` : ''}
                    
                    <div class="cart-summary-row total">
                        <span>Tổng cộng:</span>
                        <span>${formatCurrency(total)}</span>
                    </div>
                    
                    <div class="form-group" style="margin-top: 20px;">
                        <label>Khách hàng:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="customer-display" value="${selectedCustomer ? selectedCustomer.tenKH : 'Khách lẻ'}" readonly style="flex: 1;">
                            <button class="btn btn-sm btn-outline" onclick="openCustomerModal()">Chọn</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Nhân viên bán hàng:</label>
                        <select id="nhanvien-select">
                            <option value="">-- Chọn nhân viên --</option>
                            ${nhanvienList.map(nv => `<option value="${nv.maNV}">${nv.tenNV} (${nv.maNV})</option>`).join('')}
                        </select>
                    </div>
                    
                    <button class="btn btn-success" style="width: 100%; margin-top: 15px;" onclick="createInvoice()">
                        ✅ Tạo Hóa Đơn
                    </button>
                </div>
            `;
        }

        // Apply discount
        function applyDiscount() {
            const selectElement = document.getElementById('discount-code');
            const code = selectElement.value;
            
            if (!code) {
                appliedDiscount = null;
                renderCart();
                return;
            }

            const discount = discountList.find(d => d.code === code);
            if (discount) {
                appliedDiscount = discount;
                renderCart();
                showToast(`Áp dụng mã giảm giá ${discount.phantramgiam}%`, 'success');
            }
        }

        // Remove discount
        function removeDiscount() {
            appliedDiscount = null;
            renderCart();
        }

        // Open customer modal
        function openCustomerModal() {
            const modal = document.getElementById('customer-modal');
            const body = document.getElementById('customer-modal-body');

            body.innerHTML = `
                <div class="search-box" style="margin-bottom: 15px;">
                    <input type="text" class="search-input" id="search-customer" placeholder="🔍 Tìm khách hàng..." oninput="filterCustomersModal()">
                </div>
                <div id="customer-list" style="max-height: 400px; overflow-y: auto;">
                    ${renderCustomerList(customers)}
                </div>
                <div class="form-actions">
                    <button class="btn btn-outline" onclick="selectCustomer(null)">Khách Lẻ</button>
                </div>
            `;

            modal.classList.add('active');
        }

        // Render customer list
        function renderCustomerList(data) {
            if (!data || data.length === 0) {
                return '<p style="text-align: center; color: #999; padding: 20px;">Không có khách hàng</p>';
            }

            return data.map(c => `
                <div style="padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s;" 
                     onmouseover="this.style.background='#f8f9fc'" 
                     onmouseout="this.style.background='white'"
                     onclick="selectCustomer('${c.maKH}')">
                    <div style="font-weight: 600; color: #1a1a2e;">${c.tenKH}</div>
                    <div style="font-size: 12px; color: #888;">Mã: ${c.maKH} | SĐT: ${c.sdt || '-'}</div>
                </div>
            `).join('');
        }

        // Filter customers in modal
        function filterCustomersModal() {
            const keyword = document.getElementById('search-customer').value.toLowerCase();
            const filtered = customers.filter(c =>
                c.tenKH.toLowerCase().includes(keyword) ||
                c.maKH.toLowerCase().includes(keyword)
            );
            document.getElementById('customer-list').innerHTML = renderCustomerList(filtered);
        }

        // Select customer
        function selectCustomer(maKH) {
            if (maKH) {
                selectedCustomer = customers.find(c => c.maKH === maKH);
            } else {
                selectedCustomer = null;
            }
            closeCustomerModal();
            renderCart();
        }

        // Close customer modal
        function closeCustomerModal() {
            document.getElementById('customer-modal').classList.remove('active');
        }

        // Create invoice
        async function createInvoice() {
            if (cart.length === 0) {
                showToast('Giỏ hàng trống', 'error');
                return;
            }

            const maNV = document.getElementById('nhanvien-select').value;
            if (!maNV) {
                showToast('Vui lòng chọn nhân viên bán hàng', 'error');
                return;
            }

            try {
                // Generate invoice ID
                const maHD = 'HD' + Date.now().toString().slice(-8);

                // Create invoice
                const invoiceData = {
                    maHD: maHD,
                    maNV: maNV,
                    maKH: selectedCustomer ? selectedCustomer.maKH : null,
                    ngaylap: new Date().toISOString().split('T')[0],
                    codeMGG: appliedDiscount ? appliedDiscount.code : null
                };

                const invoiceRes = await fetch(`${API_BASE}/hoadon`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(invoiceData)
                });

                const invoiceResult = await invoiceRes.json();

                if (!invoiceResult.success) {
                    showToast(invoiceResult.message || 'Lỗi tạo hóa đơn', 'error');
                    return;
                }

                // Add invoice details
                for (const item of cart) {
                    const detailData = {
                        maHD: maHD,
                        maHang: item.maHang,
                        soluong: item.quantity,
                        dongia: item.price
                    };

                    await fetch(`${API_BASE}/chitiethd`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(detailData)
                    });
                }

                // Success
                lastInvoiceId = maHD;
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const discountAmount = appliedDiscount ? (subtotal * appliedDiscount.phantramgiam / 100) : 0;
                const total = subtotal - discountAmount;

                document.getElementById('success-message').innerHTML = `
                    Mã hóa đơn: <strong>${maHD}</strong><br>
                    Tổng tiền: <strong>${formatCurrency(total)}</strong>
                `;
                document.getElementById('success-modal').classList.add('active');

                // Reset cart
                cart = [];
                selectedCustomer = null;
                appliedDiscount = null;

                // Reload products
                await loadProducts();
                renderCart();

            } catch (error) {
                showToast('Lỗi: ' + error.message, 'error');
            }
        }

        // Close success modal
        function closeSuccessModal() {
            document.getElementById('success-modal').classList.remove('active');
        }

        // Print invoice
        async function printInvoice() {
            if (!lastInvoiceId) return;

            try {
                const response = await fetch(`${API_BASE}/hoadon/${lastInvoiceId}/pdf`);
                if (!response.ok) {
                    showToast('Lỗi xuất hóa đơn', 'error');
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HoaDon_${lastInvoiceId}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                closeSuccessModal();
                showToast('Đã tải hóa đơn', 'success');
            } catch (error) {
                showToast('Lỗi: ' + error.message, 'error');
            }
        }

        // Render Orders Page
        async function renderOrders() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>📋 Danh Sách Hóa Đơn</h2>
                    <p>Xem các hóa đơn đã tạo</p>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="search-order" placeholder="🔍 Tìm hóa đơn..." oninput="filterOrders()">
                    <button class="btn btn-secondary" onclick="loadOrders()">🔄 Tải Lại</button>
                </div>
                <div id="orders-container" class="table-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            `;

            await loadOrders();
        }

        let ordersList = [];

        // Load orders
        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/hoadon`);
                const result = await response.json();

                if (result.success) {
                    ordersList = result.data;
                    renderOrdersTable(ordersList);
                }
            } catch (error) {
                showToast('Lỗi tải dữ liệu hóa đơn', 'error');
            }
        }

        // Render orders table
        function renderOrdersTable(data) {
            const container = document.getElementById('orders-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Chưa có hóa đơn</p></div>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Mã HD</th>
                            <th>Ngày Lập</th>
                            <th>Khách Hàng</th>
                            <th>Nhân Viên</th>
                            <th>Tổng Tiền</th>
                            <th>Giảm Giá</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(o => `
                            <tr>
                                <td><strong>${o.maHD}</strong></td>
                                <td>${formatDate(o.ngaylap)}</td>
                                <td>${o.maKH || 'Khách lẻ'}</td>
                                <td>${o.maNV}</td>
                                <td><strong style="color: #f5576c;">${formatCurrency(o.tongtien)}</strong></td>
                                <td>${o.tiengiamgia ? formatCurrency(o.tiengiamgia) : '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick="exportPDF('${o.maHD}')">📄 PDF</button>
                                    <button class="btn btn-sm btn-success" onclick="exportExcel('${o.maHD}')">📊 Excel</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Filter orders
        function filterOrders() {
            const keyword = document.getElementById('search-order').value.toLowerCase();
            const filtered = ordersList.filter(o =>
                o.maHD.toLowerCase().includes(keyword) ||
                (o.maKH && o.maKH.toLowerCase().includes(keyword))
            );
            renderOrdersTable(filtered);
        }

        // Export PDF
        async function exportPDF(maHD) {
            try {
                const response = await fetch(`${API_BASE}/hoadon/${maHD}/pdf`);
                if (!response.ok) {
                    showToast('Lỗi xuất PDF', 'error');
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HoaDon_${maHD}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                showToast('Xuất PDF thành công', 'success');
            } catch (error) {
                showToast('Lỗi: ' + error.message, 'error');
            }
        }

        // Export Excel
        async function exportExcel(maHD) {
            try {
                const response = await fetch(`${API_BASE}/hoadon/${maHD}/export?format=excel`);
                if (!response.ok) {
                    showToast('Lỗi xuất Excel', 'error');
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HoaDon_${maHD}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                showToast('Xuất Excel thành công', 'success');
            } catch (error) {
                showToast('Lỗi: ' + error.message, 'error');
            }
        }

        // Render Customers Page
        async function renderCustomers() {
            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>👥 Danh Sách Khách Hàng</h2>
                    <p>Xem thông tin khách hàng</p>
                </div>
                <div class="search-box">
                    <input type="text" class="search-input" id="search-cust" placeholder="🔍 Tìm khách hàng..." oninput="filterCustomersList()">
                    <button class="btn btn-secondary" onclick="loadCustomers()">🔄 Tải Lại</button>
                </div>
                <div id="customers-container" class="table-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            `;

            await loadCustomers();
        }

        // Load customers
        async function loadCustomers() {
            try {
                const response = await fetch(`${API_BASE}/khachhang`);
                const result = await response.json();

                if (result.success) {
                    customers = result.data;
                    renderCustomersTable(customers);
                }
            } catch (error) {
                showToast('Lỗi tải dữ liệu khách hàng', 'error');
            }
        }

        // Render customers table
        function renderCustomersTable(data) {
            const container = document.getElementById('customers-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>Chưa có khách hàng</p></div>';
                return;
            }

            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Mã KH</th>
                            <th>Tên KH</th>
                            <th>Phân Loại</th>
                            <th>Địa Chỉ</th>
                            <th>SĐT</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(c => `
                            <tr>
                                <td><strong>${c.maKH}</strong></td>
                                <td>${c.tenKH}</td>
                                <td><span class="badge badge-success">${c.maPLKH || '-'}</span></td>
                                <td>${c.diachi || '-'}</td>
                                <td>${c.sdt || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Filter customers list
        function filterCustomersList() {
            const keyword = document.getElementById('search-cust').value.toLowerCase();
            const filtered = customers.filter(c =>
                c.tenKH.toLowerCase().includes(keyword) ||
                c.maKH.toLowerCase().includes(keyword)
            );
            renderCustomersTable(filtered);
        }

        // Utility functions
        function formatCurrency(value) {
            if (!value) return '0đ';
            return new Intl.NumberFormat('vi-VN').format(value) + 'đ';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('vi-VN');
        }

        function getStockClass(qty) {
            if (qty <= 0) return 'stock-out';
            if (qty <= 10) return 'stock-low';
            return 'stock-available';
        }

        function getStockBadge(qty) {
            if (qty <= 0) return 'badge-danger';
            if (qty <= 10) return 'badge-warning';
            return 'badge-success';
        }

        function getStockText(qty) {
            if (qty <= 0) return 'Hết hàng';
            if (qty <= 10) return 'Sắp hết';
            return 'Còn hàng';
        }

        // Show toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let icon = 'ℹ️';
            let title = 'Thông báo';
            if (type === 'success') {
                icon = '✅';
                title = 'Thành công';
            } else if (type === 'error') {
                icon = '❌';
                title = 'Lỗi';
            }

            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.remove();
                }
            }, 3000);
        }

        // Close modals when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function (e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>

  window.location.href = "login.html";
}
</script>
