<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Cửa Hàng FMSTYLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 0;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .sidebar-header h1 {
            font-size: 20px;
            color: white;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .menu-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #4fc3f7;
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: #4fc3f7;
            font-weight: bold;
        }

        .menu-item-icon {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
            background: #f5f7fa;
        }

        .page-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .page-header h2 {
            color: #1e3c72;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-secondary {
            background: #2196f3;
            color: white;
        }

        .btn-secondary:hover {
            background: #0b7dda;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background: #e68900;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 18px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 18px;
            border-bottom: 1px solid #eee;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .modal-header h3 {
            color: #1e3c72;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        /* Alert */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            max-width: 400px;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease-out, fadeOut 0.3s ease-in 2.7s forwards;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .toast:hover {
            transform: translateX(-5px);
        }

        .toast-success {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            border-left: 4px solid #2e7d32;
        }

        .toast-error {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
            border-left: 4px solid #c62828;
        }

        .toast-info {
            background: linear-gradient(135deg, #2196f3 0%, #0b7dda 100%);
            color: white;
            border-left: 4px solid #1565c0;
        }

        .toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .toast-message {
            font-size: 13px;
            opacity: 0.95;
        }

        .toast-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .toast-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(400px);
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Action buttons in table */
        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 15px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
            }

            .toast {
                min-width: auto;
                max-width: 100%;
            }
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #4caf50;
            color: white;
        }

        .badge-info {
            background: #2196f3;
            color: white;
        }
    </style>
</head>

                    { name: 'maHD', label: 'Mã HD', type: 'text', required: true },
                    { name: 'maNV', label: 'Mã NV', type: 'text', required: true },
                    { name: 'maKH', label: 'Mã KH', type: 'text', required: false },
                    { name: 'ngaylap', label: 'Ngày Lập', type: 'date', required: true },
                    { name: 'codeMGG', label: 'Mã Giảm Giá', type: 'text', required: false }
                ],
                displayFields: ['maHD', 'maNV', 'maKH', 'ngaylap', 'tongtien', 'tiengiamgia'],
                customActions: true
            },
            chitiethd: {
                title: 'Quản Lý Chi Tiết Hóa Đơn',
                api: 'chitiethd',
                fields: [
                    { name: 'maHD', label: 'Mã HD', type: 'text', required: true },
                    { name: 'maHang', label: 'Mã Hàng', type: 'text', required: true },
                    { name: 'soluong', label: 'Số Lượng', type: 'number', required: true },
                    { name: 'dongia', label: 'Đơn Giá', type: 'number', required: true }
                ],
                displayFields: ['maHD', 'maHang', 'soluong', 'dongia', 'tongtien'],
                compositeKey: ['maHD', 'maHang']
            },
            magiamgia: {
                title: 'Quản Lý Mã Giảm Giá',
                api: 'magiamgia',
                fields: [
                    { name: 'maMGG', label: 'Mã MGG', type: 'text', required: true },
                    { name: 'code', label: 'Mã Code', type: 'text', required: true },
                    { name: 'phantramgiam', label: 'Phần Trăm Giảm (%)', type: 'number', required: true },
                    { name: 'ngaybatdau', label: 'Ngày Bắt Đầu', type: 'date', required: false },
                    { name: 'ngayketthuc', label: 'Ngày Kết Thúc', type: 'date', required: false },
                    { name: 'trangthai', label: 'Trạng Thái', type: 'select', options: [{ value: '1', label: 'Còn hiệu lực' }, { value: '0', label: 'Hết hiệu lực' }], required: false },
                    { name: 'gioihan', label: 'Giới Hạn Sử Dụng', type: 'number', required: false },
                    { name: 'mota', label: 'Mô Tả', type: 'text', required: false }
                ],
                displayFields: ['maMGG', 'code', 'phantramgiam', 'ngaybatdau', 'ngayketthuc', 'trangthai', 'soluongsudung', 'gioihan']
            }
        };

        // Show page
        function showPage(pageName, element) {
            currentPage = pageName;
            editingId = null;

            // Update menu
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Activate clicked menu item
            if (element) {
                element.classList.add('active');
            } else {
                // Fallback: find menu item by page name
                const menuItems = Array.from(document.querySelectorAll('.menu-item'));
                const pageNames = Object.keys(pages);
                const pageIndex = pageNames.indexOf(pageName);
                if (pageIndex >= 0 && menuItems[pageIndex]) {
                    menuItems[pageIndex].classList.add('active');
                }
            }

            // Load page
            loadPage();
        }

        // Load page content
        async function loadPage() {
            const page = pages[currentPage];
            if (!page) return;

            const content = document.getElementById('page-content');
            content.innerHTML = `
                <div class="page-header">
                    <h2>${page.title}</h2>
                    <p>Quản lý thông tin ${page.title.toLowerCase()}</p>
                </div>
                <div id="alert" class="alert"></div>
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        ➕ Thêm Mới
                    </button>
                    <button class="btn btn-secondary" onclick="loadData()">
                        🔄 Tải Lại
                    </button>
                </div>
                <div id="table-container" class="table-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Đang tải dữ liệu...</p>
                    </div>
                </div>
            `;

            await loadData();
        }

        // Load data
        async function loadData() {
            const page = pages[currentPage];
            const container = document.getElementById('table-container');

            try {
                const response = await fetch(`${API_BASE}/${page.api}`);
                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    renderTable(result.data);
                    showAlert(`Đã tải ${result.count} bản ghi`, 'success');
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Không có dữ liệu</p></div>';
                    showAlert(result.message || 'Lỗi khi tải dữ liệu', 'error');
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Lỗi kết nối server</p></div>';
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Render table
        function renderTable(data) {
            const page = pages[currentPage];
            const container = document.getElementById('table-container');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Chưa có dữ liệu</p></div>';
                return;
            }

            let html = '<table><thead><tr>';
            page.displayFields.forEach(field => {
                html += `<th>${getFieldLabel(field)}</th>`;
            });
            html += '<th>Thao Tác</th></tr></thead><tbody>';

            data.forEach((item, index) => {
                html += '<tr>';
                page.displayFields.forEach(field => {
                    let value = item[field];
                    if (value === null || value === undefined) value = '-';
                    if (typeof value === 'boolean') {
                        value = value ? 'Còn hiệu lực' : 'Hết hiệu lực';
                    }
                    if (field === 'tongtien' || field === 'tiengiamgia') {
                        value = value ? parseFloat(value).toLocaleString('vi-VN') + ' đ' : '0 đ';
                    }
                    if (field === 'phantramgiam') {
                        value = value + '%';
                    }
                    html += `<td>${value}</td>`;
                });
                html += `<td class="action-btns">
                    <button class="btn btn-warning btn-sm" onclick="openEditModal(${index})">✏️ Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteItem(${index})">🗑️ Xóa</button>`;
                
                // Add PDF and Excel export buttons for invoices
                if (currentPage === 'hoadon') {
                    html += `<button class="btn btn-secondary btn-sm" onclick="exportPDF('${item.maHD}')">📄 PDF</button>`;
                    html += `<button class="btn btn-success btn-sm" onclick="exportExcel('${item.maHD}')">📊 Excel</button>`;
                }
                
                html += `</td></tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Get field label
        function getFieldLabel(fieldName) {
            const page = pages[currentPage];
            const field = page.fields.find(f => f.name === fieldName);
            return field ? field.label : fieldName;
        }

        // Open add modal
        function openAddModal() {
            editingId = null;
            const page = pages[currentPage];
            document.getElementById('modal-title').textContent = `Thêm ${page.title}`;
            renderForm();
            document.getElementById('modal').classList.add('active');
        }

        // Open edit modal
        function openEditModal(index) {
            editingId = index;
            const page = pages[currentPage];
            document.getElementById('modal-title').textContent = `Sửa ${page.title}`;
            renderForm(currentData[index]);
            document.getElementById('modal').classList.add('active');
        }

        // Render form
        function renderForm(data = null) {
            const page = pages[currentPage];
            const modalBody = document.getElementById('modal-body');

            let html = '<form id="data-form" onsubmit="saveData(event)">';
            page.fields.forEach(field => {
                let value = data ? (data[field.name] ?? '') : '';
                
                // Format date for input
                if (field.type === 'date' && value && value.includes('T')) {
                    value = value.split('T')[0];
                } else if (field.type === 'date' && value && !value.includes('T')) {
                    // Already formatted
                } else if (field.type === 'number' && value !== '') {
                    value = parseFloat(value);
                } else if (field.type === 'select' && value === true) {
                    value = '1';
                } else if (field.type === 'select' && value === false) {
                    value = '0';
                } else if (field.type === 'select' && typeof value === 'boolean') {
                    value = value ? '1' : '0';
                }
                
                // Special handling for invoice discount code - use codeMGG from data
                if (field.name === 'codeMGG' && data && data.codeMGG) {
                    value = data.codeMGG;
                }
                
                html += `<div class="form-group">
                    <label>${field.label} ${field.required ? '<span style="color:red">*</span>' : ''}</label>`;

                if (field.type === 'select') {
                    html += `<select name="${field.name}" ${field.required ? 'required' : ''}>`;
                    field.options.forEach(opt => {
                        html += `<option value="${opt.value}" ${value == opt.value ? 'selected' : ''}>${opt.label}</option>`;
                    });
                    html += '</select>';
                } else {
                    const inputType = field.type === 'number' ? 'number' :
                        field.type === 'date' ? 'date' :
                            field.type === 'email' ? 'email' : 'text';
                    const readonly = (field.name.includes('ma') && data && !field.name.includes('codeMGG')) ? 'readonly' : '';
                    html += `<input type="${inputType}" name="${field.name}" value="${value}" ${field.required ? 'required' : ''} ${readonly} step="${field.type === 'number' ? 'any' : ''}" placeholder="${field.name === 'codeMGG' ? 'Nhập mã giảm giá (ví dụ: SALE10)' : ''}">`;
                }
                html += '</div>';
            });
            html += `<div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                <button type="submit" class="btn btn-success">💾 Lưu</button>
            </div></form>`;

            modalBody.innerHTML = html;
        }

        // Save data
        async function saveData(event) {
            event.preventDefault();
            const page = pages[currentPage];
            const form = event.target;
            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                if (value !== '') {
                    if (key === 'gioitinh') {
                        data[key] = value === '1';
                    } else if (key.includes('ngay') || key.includes('date')) {
                        data[key] = value;
                    } else if (!isNaN(value) && value !== '') {
                        data[key] = parseFloat(value);
                    } else {
                        data[key] = value;
                    }
                }
            });

            try {
                let url = `${API_BASE}/${page.api}`;
                let method = 'POST';

                if (editingId !== null) {
                    const item = currentData[editingId];
                    if (page.compositeKey) {
                        const keys = page.compositeKey.map(k => item[k]).join('/');
                        url += `/${keys}`;
                    } else {
                        const keyField = page.fields.find(f => f.name.includes('ma') && f.required);
                        url += `/${item[keyField.name]}`;
                    }
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    closeModal();
                    await loadData();
                } else {
                    showAlert(result.message || 'Lỗi khi lưu dữ liệu', 'error');
                }
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Delete item
        async function deleteItem(index) {
            if (!confirm('Bạn có chắc chắn muốn xóa bản ghi này?')) {
                return;
            }

            const page = pages[currentPage];
            const item = currentData[index];

            try {
                let url = `${API_BASE}/${page.api}`;
                
                if (page.compositeKey) {
                    const keys = page.compositeKey.map(k => item[k]).join('/');
                    url += `/${keys}`;
                } else {
                    const keyField = page.fields.find(f => f.name.includes('ma') && f.required);
                    url += `/${item[keyField.name]}`;
                }

                const response = await fetch(url, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    await loadData();
                } else {
                    showAlert(result.message || 'Lỗi khi xóa dữ liệu', 'error');
                }
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Show alert as toast popup
        function showAlert(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            // Create toast element
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            // Set icon based on type
            let icon = 'ℹ️';
            let title = 'Thông báo';
            if (type === 'success') {
                icon = '✅';
                title = 'Thành công';
            } else if (type === 'error') {
                icon = '❌';
                title = 'Lỗi';
            } else if (type === 'info') {
                icon = 'ℹ️';
                title = 'Thông tin';
            }

            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            // Add to container
            container.appendChild(toast);

            // Auto remove after 3 seconds
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.animation = 'fadeOut 0.3s ease-in forwards';
                    setTimeout(() => {
                        if (toast.parentElement) {
                            toast.remove();
                        }
                    }, 300);
                }
            }, 3000);

            // Click to close
            toast.addEventListener('click', function(e) {
                if (e.target !== toast.querySelector('.toast-close')) {
                    toast.style.animation = 'fadeOut 0.3s ease-in forwards';
                    setTimeout(() => {
                        if (toast.parentElement) {
                            toast.remove();
                        }
                    }, 300);
                }
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingId = null;
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Export PDF
        async function exportPDF(maHD) {
            try {
                const response = await fetch(`${API_BASE}/hoadon/${maHD}/pdf`);
                if (!response.ok) {
                    const error = await response.json();
                    showAlert(error.message || 'Lỗi khi xuất PDF', 'error');
                    return;
                }
                
                // Create blob and download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HoaDon_${maHD}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showAlert('Xuất PDF thành công!', 'success');
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Export Excel
        async function exportExcel(maHD) {
            try {
                const response = await fetch(`${API_BASE}/hoadon/${maHD}/export?format=excel`);
                if (!response.ok) {
                    const error = await response.json();
                    showAlert(error.message || 'Lỗi khi xuất Excel', 'error');
                    return;
                }
                
                // Create blob and download
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HoaDon_${maHD}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showAlert('Xuất Excel thành công!', 'success');
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'error');
            }
        }

        // Initialize page on load
        window.onload = function() {
            loadPage();
        };
    </script>
</body>
</html>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user || user.role !== "admin") {
        alert("Bạn không có quyền truy cập trang Admin!");
        window.location.href = "login.html";
    }

    function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
    }
</script>
