<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>FMSTYLE - Đăng nhập</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 1100px;
            height: 520px;
            display: flex;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .image-box {
            width: 55%;
            padding: 40px;
            background: #f5f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #fff;
        }

        .right-box {
            width: 45%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form.login-box {
            width: 360px;
            padding: 36px 34px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .login-box h2 {
            text-align: center;
            color: #2f80ed;
            margin-bottom: 26px;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #2f80ed;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border-radius: 10px;
            border: 1px solid #d6e4ff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2f80ed;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle-password svg {
            stroke: #555;
        }

        .toggle-password:hover svg {
            stroke: #2f80ed;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f7bd9, #2f6bdc);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(47,128,237,0.4);
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 12.5px;
            color: #7aa7e6;
        }

        @media (max-width: 900px) {
            .container {
                width: 90%;
                height: auto;
                flex-direction: column;
            }

            .image-box {
                width: 100%;
                height: 260px;
            }

            .right-box {
                width: 100%;
                padding: 30px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="image-box">
        <img src="FM.jpg">
    </div>

    <div class="right-box">
        <form class="login-box" onsubmit="login(event)">
            <h2>FMSTYLE</h2>

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    <span class="toggle-password" onclick="togglePassword()">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12C3.5 7.5 7.5 5 12 5C16.5 5 20.5 7.5 23 12C20.5 16.5 16.5 19 12 19C7.5 19 3.5 16.5 1 12Z"
                                  stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" stroke-width="2"/>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="login-btn">ĐĂNG NHẬP</button>

            <div class="footer-text">
                © 2025 FMSTYLE Fashion
            </div>
        </form>
    </div>

</div>
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eye = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        eye.innerHTML = `
            <path d="M2 2L22 22" stroke-width="2"/>
            <path d="M1 12C3.5 7.5 7.5 5 12 5C16.5 5 20.5 7.5 23 12C20.5 16.5 16.5 19 12 19C7.5 19 3.5 16.5 1 12Z" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
        `;
    } else {
        password.type = "password";
        eye.innerHTML = `
            <path d="M1 12C3.5 7.5 7.5 5 12 5C16.5 5 20.5 7.5 23 12C20.5 16.5 16.5 19 12 19C7.5 19 3.5 16.5 1 12Z" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
        `;
    }
}

async function login(e) {
    e.preventDefault();

    const username = document.getElementById("username");
    const password = document.getElementById("password");

    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: username.value.trim(),
                password: password.value.trim()
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || "Sai tài khoản hoặc mật khẩu");
            return;
        }

        // Lưu thông tin user vào localStorage
        const userData = data.user || data;
        localStorage.setItem("user", JSON.stringify(userData));

        // Điều hướng theo role
        if (userData.role === "admin") {
            window.location.href = "index.html"; // dashboard admin
        } else {
            window.location.href = "cusstomer.html"; // dashboard nhân viên bán hàng
        }
    } catch (err) {
        alert("Lỗi kết nối server: " + err.message);
    }
}
</script>

</body>
</html>
