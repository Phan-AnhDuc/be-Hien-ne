        async function loadStatistics() {
            try {
                const period = document.getElementById('stat-period').value;
                let url = `${API_BASE}/thongke/doanhthu?period=${period}`;
                
                if (period === 'day') {
                    const startDate = document.getElementById('stat-start-date').value;
                    const endDate = document.getElementById('stat-end-date').value;
                    url += `&startDate=${startDate}&endDate=${endDate}`;
                } else if (period === 'month') {
                    const month = document.getElementById('stat-month').value;
                    const year = document.getElementById('stat-year').value;
                    // Tính startDate và endDate cho tháng
                    const startDate = `${year}-${String(month).padStart(2, '0')}-01`;
                    const lastDay = new Date(year, month, 0).getDate();
                    const endDate = `${year}-${String(month).padStart(2, '0')}-${lastDay}`;
                    url += `&startDate=${startDate}&endDate=${endDate}`;
                } else if (period === 'quarter') {
                    const quarter = document.getElementById('stat-quarter').value;
                    const year = document.getElementById('stat-year').value;
                    const startMonth = (parseInt(quarter) - 1) * 3 + 1;
                    const endMonth = parseInt(quarter) * 3;
                    const startDate = `${year}-${String(startMonth).padStart(2, '0')}-01`;
                    const lastDay = new Date(year, endMonth, 0).getDate();
                    const endDate = `${year}-${String(endMonth).padStart(2, '0')}-${lastDay}`;
                    url += `&startDate=${startDate}&endDate=${endDate}`;
                } else if (period === 'year') {
                    const year = document.getElementById('stat-year').value;
                    const startDate = `${year}-01-01`;
                    const endDate = `${year}-12-31`;
                    url += `&startDate=${startDate}&endDate=${endDate}`;
                }
                
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    const stats = result.data;
                    
                    // Tính tổng
                    const totalRevenue = stats.reduce((sum, s) => sum + (parseFloat(s.tongDoanhThu) || 0), 0);
                    const totalOrders = stats.reduce((sum, s) => sum + (parseInt(s.soHoaDon) || 0), 0);
                    
                    // Hiển thị summary
                    document.getElementById('stat-summary').innerHTML = `
                        <div class="stat-card green">
                            <h3>${formatCurrency(totalRevenue)}</h3>
                            <p>Tổng doanh thu</p>
                        </div>
                        <div class="stat-card blue">
                            <h3>${totalOrders}</h3>
                            <p>Tổng số hóa đơn</p>
                        </div>
                        <div class="stat-card purple">
                            <h3>${stats.length}</h3>
                            <p>Số ${period === 'day' ? 'ngày' : period === 'week' ? 'tuần' : period === 'month' ? 'tháng' : period === 'quarter' ? 'quý' : 'năm'}</p>
                        </div>
                        <div class="stat-card orange">
                            <h3>${totalOrders > 0 ? formatCurrency(totalRevenue / totalOrders) : '0đ'}</h3>
                            <p>Trung bình mỗi hóa đơn</p>
                        </div>
                    `;
                    
                    renderStatisticsTable(stats, period);
                } else {
                    showToast('Lỗi tải thống kê', 'error');
                }
            } catch (error) {
                showToast('Lỗi tải thống kê: ' + error.message, 'error');
            }
        }

        async function submitReturnProduct(maHD) {
            try {
                const order = ordersList.find(o => o.maHD === maHD);
                if (!order || !order.id) {
                    showToast('Không tìm thấy hóa đơn', 'error');
                    return;
                }
                
                const idHD = order.id;
                const response = await fetch(`${API_BASE}/chitiethd/${idHD}`);
                const result = await response.json();
                
                if (!result.success || !result.data.length) {
                    showToast('Không có chi tiết hóa đơn', 'error');
                    return;
                }
                
                const details = result.data;
                const items = [];
                
                for (const item of details) {
                    const qtyInput = document.getElementById(`return-qty-${item.idHang}`);
                    if (qtyInput && parseInt(qtyInput.value) > 0) {

                    body: JSON.stringify({ items })

        // ==================== UTILITIES ====================
        function formatCurrency(value) {
            if (!value) return '0đ';
            return new Intl.NumberFormat('vi-VN').format(value) + 'đ';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('vi-VN');
        }

        function getStockClass(qty) {
            if (qty <= 0) return 'stock-danger';
            if (qty < 20) return 'stock-warning';
            return 'stock-ok';
        }

        function getStockBadge(qty) {
            if (qty <= 0) return 'badge-danger';
            if (qty < 20) return 'badge-warning';
            return 'badge-success';
        }

        function getStockText(qty) {
            if (qty <= 0) return 'Hết hàng';
            if (qty < 20) return 'Sắp hết';
            return 'Còn hàng';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let title = 'Thông báo';
            if (type === 'success') title = 'Thành công';
            else if (type === 'error') title = 'Lỗi';

            toast.innerHTML = `
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 3000);
        }

        // Close modals when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function (e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>
